<title>Lobby</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EDEAE3; --ground-2:#E3DFD4; --card:#FCFBF8; --card-2:#F5F2EA;
  --ink:#17201B; --ink-2:#4C5A52; --ink-3:#7E8A83;
  --line:#D6D1C5; --line-2:#E7E3D9;
  --green:#1F6B4F; --green-deep:#14503A; --green-bg:#DCEAE1; --green-ink:#0E3D2C;
  --clay:#A8501F; --clay-deep:#7E3A13; --clay-bg:#F4E2D4;
  --red:#8E2F24; --red-bg:#F3DED9;
  --gold:#B07D16; --gold-bg:#F6E9C9;
  --shadow:0 1px 2px rgba(23,32,27,.05), 0 10px 26px -18px rgba(23,32,27,.35);
  --lift:0 2px 4px rgba(23,32,27,.06), 0 18px 40px -24px rgba(23,32,27,.5);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121614; --ground-2:#0C100E; --card:#1A201C; --card-2:#212824;
    --ink:#E7EBE7; --ink-2:#A6B1AA; --ink-3:#74807A;
    --line:#2B332E; --line-2:#232A26;
    --green:#4FB98A; --green-deep:#2E8C64; --green-bg:#152B22; --green-ink:#A6DCC3;
    --clay:#DB8B52; --clay-deep:#A9663A; --clay-bg:#2D2018;
    --red:#DE7C6D; --red-bg:#2E1A17;
    --gold:#D9B05C; --gold-bg:#2C2414;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.7);
    --lift:0 2px 4px rgba(0,0,0,.5), 0 18px 40px -24px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#121614; --ground-2:#0C100E; --card:#1A201C; --card-2:#212824;
  --ink:#E7EBE7; --ink-2:#A6B1AA; --ink-3:#74807A;
  --line:#2B332E; --line-2:#232A26;
  --green:#4FB98A; --green-deep:#2E8C64; --green-bg:#152B22; --green-ink:#A6DCC3;
  --clay:#DB8B52; --clay-deep:#A9663A; --clay-bg:#2D2018;
  --red:#DE7C6D; --red-bg:#2E1A17;
  --gold:#D9B05C; --gold-bg:#2C2414;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.7);
  --lift:0 2px 4px rgba(0,0,0,.5), 0 18px 40px -24px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{
  background:var(--ground-2); color:var(--ink);
  font-family:'Public Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  line-height:1.5; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(var(--line) 1px, transparent 1px);
  background-size:22px 22px; background-position:-11px -11px;
}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;margin:0;text-wrap:balance;color:var(--ink)}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
:focus-visible{outline:2.5px solid var(--green);outline-offset:2px;border-radius:6px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
svg{display:block}

/* ============ shell ============ */
.app{max-width:468px;margin:0 auto;min-height:100svh;background:var(--ground);
  border-inline:1px solid var(--line);display:flex;flex-direction:column}
@media (max-width:500px){ .app{border-inline:none} }

.topbar{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--line);
  padding-block:13px;padding-inline:18px;display:flex;align-items:center;gap:10px}
.topbar .brand{font-family:'Fraunces',serif;font-weight:700;font-size:22px;letter-spacing:-.025em}
.streak{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--gold-bg);
  color:var(--gold);border-radius:999px;padding:5px 11px 5px 8px;font-weight:700;font-size:13.5px}
.streak.zero{background:var(--card-2);color:var(--ink-3)}
.streak .n{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

.screens{flex:1;padding-inline:16px;padding-block:16px 104px}
.screen{display:flex;flex-direction:column;gap:14px}

.tabbar{position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--ground);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{padding-block:9px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--ink-3);position:relative}
.tabbar button[aria-selected="true"]{color:var(--green)}
.tabbar .badge{position:absolute;top:5px;left:50%;margin-left:8px;width:9px;height:9px;
  border-radius:50%;background:var(--clay);border:2px solid var(--ground)}

/* ============ type ============ */
.head h2{font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.head .sub{font-size:14.5px;color:var(--ink-2);margin-top:5px;max-width:44ch}
.sectionlabel{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* ============ buttons ============ */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:14px 18px;border-radius:12px;font-weight:800;font-size:15.5px;letter-spacing:.005em;
  background:var(--green);color:var(--ground);position:relative;top:0;
  box-shadow:0 4px 0 var(--green-deep);transition:top .07s ease, box-shadow .07s ease}
.btn:active{top:3px;box-shadow:0 1px 0 var(--green-deep)}
.btn[disabled]{opacity:.5;cursor:not-allowed;top:0;box-shadow:0 4px 0 var(--green-deep)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:1px solid var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.clay{background:var(--clay);color:var(--ground);box-shadow:0 4px 0 var(--clay-deep)}
.btn.clay:active{box-shadow:0 1px 0 var(--clay-deep)}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:10px}
.btn.auto{width:auto}
.linkish{font-size:14px;font-weight:600;color:var(--ink-2);text-decoration:underline;
  text-underline-offset:3px;padding:6px 2px;width:100%;text-align:center}

/* ============ cards ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.stackv{display:flex;flex-direction:column;gap:12px}

.act{width:100%;display:block;transition:transform .08s ease}
.act:active{transform:scale(.985)}
.act .row{display:flex;gap:12px;align-items:flex-start;padding:15px 15px 0;width:100%;cursor:pointer}
.act .txt{min-width:0;flex:1}
.act h3{font-size:19px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.act .when{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-2);margin-top:5px}
.act .fig{flex-shrink:0}
.act .foot{padding:11px 15px 14px;display:flex;flex-direction:column;gap:10px}

.dayhead{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);padding:6px 2px 0;display:flex;align-items:center;gap:10px}
.dayhead::after{content:"";flex:1;height:1px;background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 8px;border-radius:6px;background:var(--card-2);color:var(--ink-2);border:1px solid var(--line-2)}
.chip.ok{background:var(--green-bg);color:var(--green-ink);border-color:transparent}
.chip.warn{background:var(--clay-bg);color:var(--clay);border-color:transparent}
.chip.bad{background:var(--red-bg);color:var(--red);border-color:transparent}
.chip.gold{background:var(--gold-bg);color:var(--gold);border-color:transparent}

/* activity mark */
.arttile{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;
  background:var(--green-bg);color:var(--green);flex-shrink:0}

/* progress */
.prog{display:flex;flex-direction:column;gap:6px}
.prog .track{height:10px;border-radius:99px;background:var(--card-2);border:1px solid var(--line-2);
  overflow:hidden;position:relative}
.prog .fill{position:absolute;left:0;top:0;height:100%;background:var(--green);border-radius:99px;
  transition:width .5s cubic-bezier(.2,.8,.2,1)}
.prog .fill.soft{background:color-mix(in srgb,var(--green) 32%,transparent)}
.prog .fill.gold{background:var(--gold)}
.prog .notch{position:absolute;top:0;bottom:0;width:2px;background:var(--ink-3);opacity:.45}
.prog .cap{font-size:12.5px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.prog .cap b{color:var(--ink);font-weight:700}

/* table figure */
.tablefig .surface{fill:var(--card-2);stroke:var(--line);stroke-width:1.5}
.tablefig .seat-empty{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.tablefig .seat-taken{fill:var(--green);stroke:var(--green);stroke-width:1.5}
.tablefig .seat-me{fill:var(--clay);stroke:var(--clay);stroke-width:1.5}
.tablefig .pop{animation:pop .34s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}

/* ============ urgent banner ============ */
.urgent{display:block;width:100%;border-radius:var(--r);padding:15px 16px;
  background:var(--clay);color:var(--ground);box-shadow:0 4px 0 var(--clay-deep);position:relative;top:0;
  transition:top .07s ease, box-shadow .07s ease}
.urgent:active{top:3px;box-shadow:0 1px 0 var(--clay-deep)}
.urgent.calm{background:var(--green);box-shadow:0 4px 0 var(--green-deep)}
.urgent.calm:active{box-shadow:0 1px 0 var(--green-deep)}
.urgent .k{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.82}
.urgent .t{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin-top:3px;line-height:1.25}
.urgent .d{font-size:13.5px;margin-top:4px;opacity:.9}

/* ============ misc ============ */
.filters{display:flex;flex-wrap:wrap;gap:7px}
.filters button{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink-2);transition:transform .08s}
.filters button:active{transform:scale(.95)}
.filters button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--ground)}

.note{border-radius:11px;padding:13px 15px;font-size:14px;line-height:1.5;
  background:var(--green-bg);color:var(--green-ink);border-left:4px solid var(--green)}
.note.warn{background:var(--clay-bg);color:var(--clay);border-left-color:var(--clay)}
.note.bad{background:var(--red-bg);color:var(--red);border-left-color:var(--red)}
.note b{font-weight:800}

.empty{border:2px dashed var(--line);border-radius:var(--r);padding:26px 20px;
  display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;background:transparent}
.empty h4{font-size:17px;font-weight:600}
.empty p{font-size:14px;color:var(--ink-2);max-width:34ch}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 11px;text-align:center}
.stat .v{font-family:'Fraunces',serif;font-size:25px;font-weight:700;line-height:1.1;
  font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;font-weight:700;color:var(--ink-3);margin-top:3px;letter-spacing:.02em}

.roster{display:flex;flex-direction:column}
.person{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line-2);width:100%}
.roster .person:last-child{border-bottom:none}
.avatar{width:36px;height:36px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;
  background:var(--green-bg);color:var(--green-ink);font-weight:800;font-size:14px}
.avatar.me{background:var(--clay-bg);color:var(--clay)}
.person .nm{font-size:15px;font-weight:600}
.person .rl{font-size:11.5px;font-weight:600;color:var(--ink-3);margin-top:1px}
.person .end{margin-left:auto;flex-shrink:0}
.person .tick{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center}
.person[aria-pressed="true"] .tick{background:var(--green);border-color:var(--green)}
.person[aria-pressed="true"]{background:var(--green-bg);border-radius:11px}
.dots{font-size:19px;color:var(--ink-3);padding:3px 9px;line-height:1}

.chat{display:flex;flex-direction:column;gap:9px;max-height:330px;overflow-y:auto;padding-right:3px}
.msg{display:flex;flex-direction:column;gap:3px;max-width:86%}
.msg .by{font-size:11px;font-weight:700;color:var(--ink-3)}
.msg .bubble{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;
  padding:10px 13px;font-size:14.5px;line-height:1.45}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bubble{background:var(--green);border-color:transparent;color:var(--ground);border-radius:14px 4px 14px 14px}
.msg.bot .bubble{background:var(--card-2);border-style:dashed}
.composer{display:flex;gap:8px}
.composer input{flex:1;font:inherit;padding:12px 14px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);min-width:0}

.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.field input,.field select{font:inherit;padding:13px 14px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);width:100%}
.field input:focus,.field select:focus{border-color:var(--green)}
.field .hint{font-size:12.5px;color:var(--ink-3);line-height:1.45}

.pick{display:grid;gap:8px}
.pickbtn{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:13px 15px;
  font-size:15px;font-weight:600;transition:transform .08s}
.pickbtn:active{transform:scale(.98)}
.pickbtn[aria-pressed="true"]{border-color:var(--green);background:var(--green-bg);color:var(--green-ink)}

/* ============ overlays ============ */
.veil{position:fixed;inset:0;z-index:50;background:rgba(10,14,12,.5);display:grid;
  place-items:end center;animation:fade .18s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--ground);width:100%;max-width:468px;max-height:92svh;overflow-y:auto;
  border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:none;
  padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:14px;animation:slideup .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideup{from{transform:translateY(26px)}to{transform:translateY(0)}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 2px}
.sheet-head{display:flex;align-items:flex-start;gap:12px}
.sheet-head h3{font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.sheet-head .x{margin-left:auto;font-size:24px;color:var(--ink-3);line-height:1;padding:0 5px;flex-shrink:0}

.celebrate{position:fixed;inset:0;z-index:70;background:var(--ground);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:28px 26px;text-align:center;
  animation:fade .2s ease both}
.celebrate .art{animation:rise .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes rise{from{transform:translateY(14px) scale(.86);opacity:0}to{transform:none;opacity:1}}
.celebrate h2{font-size:31px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.celebrate p{font-size:16px;color:var(--ink-2);max-width:32ch;line-height:1.5}
.celebrate .actions{width:100%;max-width:320px;display:flex;flex-direction:column;gap:9px;margin-top:6px}
.spark{position:absolute;width:9px;height:9px;border-radius:2px;opacity:0}
.pop-in{animation:spark .9s ease-out both}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3) rotate(180deg)}}

.signin{margin-left:auto;font-size:13px;font-weight:700;color:var(--green);
  border:1.5px solid var(--green);border-radius:999px;padding:5px 13px}
.auth{position:fixed;inset:0;z-index:78;outline:none;background:var(--ground);overflow-y:auto;
  display:flex;flex-direction:column;padding:22px 22px calc(26px + env(safe-area-inset-bottom,0px))}
.auth .atop{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.auth .abrand{font-family:'Fraunces',serif;font-weight:700;font-size:24px;letter-spacing:-.025em}
.auth .aback{margin-left:auto;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.auth .abody{flex:1;display:flex;flex-direction:column;gap:15px;max-width:420px;width:100%;margin:0 auto}
.auth h2{font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.auth .abody>p{font-size:15.5px;color:var(--ink-2);line-height:1.5;margin-top:-6px}
.auth .codein{font-family:'IBM Plex Mono',monospace;font-size:26px;letter-spacing:.32em;
  text-align:center;font-variant-numeric:tabular-nums}
.onb{position:fixed;inset:0;z-index:75;outline:none;background:var(--ground);display:flex;flex-direction:column;
  padding:26px 24px calc(24px + env(safe-area-inset-bottom,0px));gap:16px}
.onb .body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
  gap:14px;text-align:center}
.onb h2{font-size:29px;font-weight:700;letter-spacing:-.025em;line-height:1.12}
.onb p{font-size:16px;color:var(--ink-2);max-width:32ch;line-height:1.5}
.onb .dotrow{display:flex;gap:7px;justify-content:center}
.onb .d{width:8px;height:8px;border-radius:99px;background:var(--line)}
.onb .d.on{background:var(--green);width:22px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:80;
  background:var(--ink);color:var(--ground);padding:12px 17px;border-radius:11px;font-size:14px;
  font-weight:600;max-width:min(420px,92vw);box-shadow:var(--lift);line-height:1.4;
  animation:toastin .2s cubic-bezier(.2,.9,.3,1) both}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.toast.bad{background:var(--red);color:#fff}

.demo{border:2px dashed var(--clay);border-radius:var(--r);padding:15px;display:flex;
  flex-direction:column;gap:11px;background:var(--clay-bg)}
.demo h4{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--clay)}
.demo p{font-size:13px;color:var(--clay);line-height:1.45}
.demo .row{display:flex;flex-wrap:wrap;gap:7px}
.demo button{font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:9px;
  border:1.5px solid var(--clay);color:var(--clay);background:transparent}
.demo button:active{background:var(--card)}

.matchcard{display:block;width:100%;border-radius:var(--r);padding:17px 18px;text-align:left;
  background:var(--green);color:var(--ground);box-shadow:0 4px 0 var(--green-deep);
  position:relative;top:0;transition:top .07s ease, box-shadow .07s ease}
.matchcard:active{top:3px;box-shadow:0 1px 0 var(--green-deep)}
.matchcard .k{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.matchcard .t{font-family:'Fraunces',serif;font-size:23px;font-weight:600;margin-top:3px;line-height:1.15}
.matchcard .d{font-size:13.5px;margin-top:5px;opacity:.9;line-height:1.4}
.matchcard.waiting{background:var(--card-2);color:var(--ink);box-shadow:none;
  border:2px dashed var(--line);cursor:default}
.matchcard.waiting .k{color:var(--ink-3)}
.matchcard.have{background:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.35)}

.overlap{display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px;margin-top:4px}
.orow{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:11px 14px;text-align:left}
.orow .ok{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.orow .ov{font-size:15px;font-weight:600;color:var(--ink)}

.plan{background:var(--card-2);border:1px solid var(--line-2);border-radius:12px;padding:14px 16px;
  display:flex;flex-direction:column;gap:4px}
.plan .k{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.plan .pw{font-family:'Fraunces',serif;font-size:19px;font-weight:600;line-height:1.2}

    t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
}
function tableCount(n){ if(n<=6)return 1; var k=Math.ceil(n/6); if(n/k<4&&k>1)k--; return k; }
function isBlockedPair(x,y){ return !!(state.blocks[x+"__"+y]||state.blocks[y+"__"+x]); }
function pairKey(x,y){ return x<y ? x+"|"+y : y+"|"+x; }

/* Seating is computed for the WHOLE week in one chronological pass, so
   "have these two met before" is a map lookup rather than a recursive
   re-solve of every earlier activity. Recomputing lazily on any change
   that could move someone. */
var seatBook=null;                 // {tables:{actId:[[seat]]}, met:{pair:actIndex}, order:{actId:idx}}
function markSeatingDirty(){ seatBook=null; }

function hasBlockedPair(t){
  for(var i=0;i<t.length;i++)for(var j=i+1;j<t.length;j++)
    if(isBlockedPair(t[i].studentId,t[j].studentId))return true;
  return false;
}
function mixPenalty(table){
  var counts={}, known=0;
  table.forEach(function(m){
    var g=(state.students[m.studentId]||{}).group;
    if(g){ counts[g]=(counts[g]||0)+1; known++; }
  });
  if(known<2)return 0;
  var top=0; Object.keys(counts).forEach(function(k){ if(counts[k]>top)top=counts[k]; });
  var allowed=Math.ceil(known/2);
  return top>allowed ? (top-allowed)*1.5 : 0;
}
function tableCost(table,met,idx){
  var c=mixPenalty(table);
  for(var i=0;i<table.length;i++)for(var j=i+1;j<table.length;j++){
    var x=table[i].studentId, y=table[j].studentId;
    if(isBlockedPair(x,y)) c+=1000;
    else { var seen=met[pairKey(x,y)]; if(seen!=null&&seen<idx) c+=3; }
  }
  return c;
}
/* pull one member of a blocked pair onto another table; returns true if it moved */
function repairBlocked(tables){
  for(var t1=0;t1<tables.length;t1++){
    if(!hasBlockedPair(tables[t1]))continue;
    for(var x=0;x<tables[t1].length;x++){
      for(var t2=0;t2<tables.length;t2++){
        if(t2===t1)continue;
        for(var y=0;y<tables[t2].length;y++){
          var A=tables[t1][x], B=tables[t2][y];
          tables[t1][x]=B; tables[t2][y]=A;
          if(!hasBlockedPair(tables[t1])&&!hasBlockedPair(tables[t2]))return true;
          tables[t1][x]=A; tables[t2][y]=B;
        }
      }
    }
  }
  return false;
}
function computeSeating(actId,met,idx){
  var roster=confirmedSeats(actId).slice().sort(function(a,b){
    return (a.claimedAt||0)-(b.claimedAt||0) || (a.studentId<b.studentId?-1:1);
  });
  var n=roster.length; if(!n)return [];
  var k=tableCount(n), tables=[], i, j;
  if(k===1)return [roster];
  var order=roster.slice(), rnd=seedRand(actId);
  for(i=order.length-1;i>0;i--){ j=Math.floor(rnd()*(i+1)); var tmp=order[i];order[i]=order[j];order[j]=tmp; }
  for(i=0;i<k;i++)tables.push([]);
  var sizes=[]; for(i=0;i<k;i++) sizes.push(Math.floor(n/k)+(i<n%k?1:0));
  var at=0; for(i=0;i<k;i++)for(j=0;j<sizes[i];j++) tables[i].push(order[at++]);
  for(var pass=0;pass<12;pass++){
    var improved=false;
    for(var ta=0;ta<k;ta++)for(var tb=ta+1;tb<k;tb++)
      for(var xi=0;xi<tables[ta].length;xi++)for(var yi=0;yi<tables[tb].length;yi++){
        var before=tableCost(tables[ta],met,idx)+tableCost(tables[tb],met,idx);
        var A=tables[ta][xi], B=tables[tb][yi];
        tables[ta][xi]=B; tables[tb][yi]=A;
        if(tableCost(tables[ta],met,idx)+tableCost(tables[tb],met,idx)<before-1e-9) improved=true;
        else { tables[ta][xi]=A; tables[tb][yi]=B; }
      }
    if(!improved)break;
  }
  for(var r=0;r<tables.length&&repairBlocked(tables);r++){}   // blocking is a hard rule
  return tables;
}
function buildSeatBook(){
  var book={tables:{},met:{},order:{}};
  var acts=state.activities.slice().sort(function(a,b){return ts(a)-ts(b);});
  acts.forEach(function(a,idx){
    book.order[a.id]=idx;
    var tables=computeSeating(a.id,book.met,idx);
    book.tables[a.id]=tables;
    tables.forEach(function(t){
      for(var i=0;i<t.length;i++)for(var j=i+1;j<t.length;j++){
        var key=pairKey(t[i].studentId,t[j].studentId);
        if(book.met[key]==null) book.met[key]=idx;    // first time they shared a table
      }
    });
  });
  seatBook=book;
}
function seatingFor(actId){
  if(!seatBook)buildSeatBook();
  return seatBook.tables[actId]||[];
}
/* did x and y share a table at something EARLIER than this activity? */
function metBefore(actId,x,y){
  if(!seatBook)buildSeatBook();
  var seen=seatBook.met[pairKey(x,y)], idx=seatBook.order[actId];
  return seen!=null && idx!=null && seen<idx;
}

  for(var i=0;i<tb.length;i++)
    for(var j=0;j<tb[i].length;j++)

  return -1;
}
function myTable(actId){

}
/* the honest answer to "why am I sat with these people" */
function whyThisTable(a){

  var tb=seatingFor(a.id);

  var bits=["You all chose "+a.title+" — that's the whole match"];
  if(tb.length>1) bits.push(mine.length+" of the "+confirmedSeats(a.id).length+
    " going are at your table, split so nobody ends up in a pair");

}

/* Why two people fit: a shared Discord server is the strongest signal because it is
   narrow, a shared like is next, and a shared dislike is real bonding. A like that is
   someone else's dislike costs. */
function pairScore(x,y){
  var sv=shared(listOf(x,"servers"),listOf(y,"servers")).length;
  var lk=shared(listOf(x,"likes"),listOf(y,"likes")).length;
  var dk=shared(listOf(x,"dislikes"),listOf(y,"dislikes")).length;
  var clash=shared(listOf(x,"likes"),listOf(y,"dislikes")).length
          + shared(listOf(y,"likes"),listOf(x,"dislikes")).length;
  return sv*3 + lk*2 + dk*1 - clash*1.5;
}

  return { servers:shared(listOf(x,"servers"),listOf(y,"servers")),

}

    ids.forEach(function(id){ listOf(id,f).forEach(function(v){ counts[v]=(counts[v]||0)+1; }); });
    Object.keys(counts).forEach(function(v){ if(counts[v]>=2) out[f].push({v:v,n:counts[v]}); });
    out[f].sort(function(a,b){return b.n-a.n;});

function tableFigure(slots,size,animate,key){
  var ns="http://www.w3.org/2000/svg", w=size||110;
  var svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox","0 0 120 84"); svg.setAttribute("width",String(w));
  svg.setAttribute("height",String(Math.round(w*0.7))); svg.setAttribute("class","tablefig");
  svg.setAttribute("role","img");
  var filled=slots.filter(function(x){return x;}).length;
  svg.setAttribute("aria-label",filled+" of 6 seats at this table taken");
  var e=document.createElementNS(ns,"ellipse");
  e.setAttribute("cx","60");e.setAttribute("cy","42");e.setAttribute("rx","25");e.setAttribute("ry","15");
  e.setAttribute("class","surface");svg.appendChild(e);
  var prev=key?(state.seenSeats[key]||0):0;
  for(var i=0;i<6;i++){
    var ang=(Math.PI*2*i/6)-Math.PI/2;
    var cx=60+Math.cos(ang)*43, cy=42+Math.sin(ang)*31;
    var c=document.createElementNS(ns,"circle");
    c.setAttribute("cx",cx.toFixed(1));c.setAttribute("cy",cy.toFixed(1));c.setAttribute("r","7.5");
    c.setAttribute("class",!slots[i]?"seat-empty":(slots[i]==="me"?"seat-me":"seat-taken"));
    if(slots[i]&&animate&&i>=prev&&!reduced()){
      c.classList.add("pop");
      c.style.transformOrigin=cx.toFixed(1)+"px "+cy.toFixed(1)+"px";
      c.style.animationDelay=((i-prev)*0.05)+"s";
    }
    svg.appendChild(c);
  }
  if(key&&animate) state.seenSeats[key]=filled;
  return svg;
}
/* build the slots for an activity: your table if one exists, else the forming table */
function figFor(a,size,animate){
  var slots=[null,null,null,null,null,null], i;
  var mine=tableOpen(a)?myTable(a.id):null;
  if(mine&&mine.length){
    for(i=0;i<Math.min(6,mine.length);i++)
      slots[i]=(state.me&&mine[i].studentId===state.me.id)?"me":"other";
  } else {
    var taken=takenSeats(a.id);
    if(taken.length<=6){
      taken.forEach(function(t){
        var idx=Math.max(0,Math.min(5,(t.seatNo||1)-1));
        slots[idx]=(state.me&&t.studentId===state.me.id)?"me":"other";
      });
    } else {
      for(i=0;i<6;i++) slots[i]="other";
      if(mySeat(a.id)) slots[0]="me";
    }
  }
  return tableFigure(slots,size,animate,a.id);
}

async function takeSeat(a){

      if(!lease.acquired)continue;
      var snap=await ref.get();
      var body=snap.exists?snap.data():null;
      if(body&&body.studentId&&!body.released)continue;
      await ref.set({seatNo:n,studentId:state.me.id,name:state.me.name,claimedAt:Date.now(),confirmed:false,paid:PRICE});
      return n;

  if(reapBusy[a.id])return;
  var ph=phaseOf(a);
  if(ph==="open"||ph==="confirming")return;
  var stale=seatsOf(a.id).filter(function(x){return x.studentId&&!x.released&&!x.confirmed;});
  if(!stale.length)return;
  reapBusy[a.id]=true;
  try{
    for(var i=0;i<stale.length;i++){
      try{ await seatDoc(a.id,stale[i].seatNo).update({released:true,releasedAt:Date.now()}); }
      catch(e){ break; }
    }
  }finally{ reapBusy[a.id]=false; }
}

  try{ await seatDoc(a.id,s.seatNo)["delete"]();

  catch(e){toast(dbFail(e),true);}

}
async function postMessage(actId,msg,tableIdx){
  var ti=(tableIdx==null?myTableIndex(actId):tableIdx);
  var ref=chatDoc(actId,(ti<0?0:ti)+1);
  for(var i=0;i<4;i++){
    try{
      var lease=await ref.acquire({holder:state.me?state.me.id:"anon",ttlMs:3000});
      if(!lease.acquired){await sleep(200+Math.random()*300);continue;}
      var snap=await ref.get();
      var msgs=(snap.exists&&snap.data().messages)?snap.data().messages.slice():[];
      if(msgs.some(function(m){return m.id===msg.id;}))return true;
      msgs.push(msg);
      await ref.set({messages:msgs.slice(-150)});
      return true;
    }catch(e){toast(dbFail(e),true);return false;}
  }
  toast("The chat was busy — send that again.",true); return false;
}
function hash(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return h;}

async function postBotFor(a){
  var seat=mySeat(a.id);
  if(!seat||!seat.confirmed)return;          // only ever opens your own table's chat
  var i=myTableIndex(a.id); if(i<0)return;
  var tb=seatingFor(a.id), host=hostOf(a.id,i); if(!host)return;
  var log=(state.chats[a.id]||{})["t"+(i+1)]||[];
  var plan="bot-plan-"+a.id+"-"+i, ice="bot-ice-"+a.id+"-"+i;
  if(!log.some(function(m){return m.id===plan;})){
    await postMessage(a.id,{id:plan,kind:"bot",by:"bot",name:"Lobby",
      text:a.title+", "+fmtWhen(a)+", "+a.venue+
        (tb.length>1?" — table "+(i+1)+" of "+tb.length:"")+". "+tb[i].length+
        " of you. Ask for "+tableWord(a.id,i)+" when you get there. "+host.name+
        " is hosting, so they'll tap in first and say where they're sitting.",
      at:Date.now()},i);
  }
  if(!log.some(function(m){return m.id===ice;})){
    await postMessage(a.id,{id:ice,kind:"bot",by:"bot",name:"Lobby",
      text:ICEBREAKERS[Math.abs(hash(a.id+i))%ICEBREAKERS.length],at:Date.now()+1},i);

}

      .set({by:state.me.id,target:seat.studentId,actId:a.id,note:note||"",at:Date.now(),status:"open"});

function urgentItem(){
  if(!state.me)return null;
  var list=myActivities(), best=null;
  list.forEach(function(a){
    var ph=phaseOf(a), s=mySeat(a.id);
    if(isCancelled(a))return;
    if(ph==="confirming"&&s&&!s.confirmed)
      best=best||{a:a,kind:"confirm",k:"Needs you now",t:"Confirm your seat — "+a.title,
        d:"Window closes in "+fmtLeft(confirmClosesAt(a)-now())+". Miss it and the seat goes back.",urgent:true};
    else if(isArrivalTime(a)&&s&&s.confirmed)
      best=best||{a:a,kind:"table",k:iAmHere(a.id)?"You're there":"Starting now",
        t:iAmHere(a.id)?a.title:"Tap when you get there",
        d:iAmHere(a.id)?(arrivedAt(a.id).length+" of "+myTable(a.id).length+" at the table")
                       :meetAt(a)+" — ask for "+tableWord(a.id,Math.max(0,myTableIndex(a.id))),
        urgent:!iAmHere(a.id)};
    else if(ph==="done"&&s&&s.confirmed&&!myCheckin(a))
      best=best||{a:a,kind:"checkin",k:"One question",t:"Did you make it to "+a.title+"?",
        d:"Takes a second, and anything you flag reaches a moderator tonight.",urgent:false};
    else if(ph==="done"&&s&&s.confirmed&&myCheckin(a)&&myCheckin(a).madeIt&&!mySignal(a))
      best=best||{a:a,kind:"signal",k:"Last thing",t:"Anyone you'd see again?",
        d:"Silent unless it's mutual — always.",urgent:false};
    else if(ph==="locked"&&s&&s.confirmed)
      best=best||{a:a,kind:"table",k:"Locked in",t:a.title+" is on",
        d:"Starts in "+fmtLeft(ts(a)-now())+". The table chat is open.",urgent:false};
  });
  return best;
}

function progressBar(a){
  var conf=confirmedSeats(a.id).length, taken=takenSeats(a.id).length, cap0=capOf(a);
  var booked=a.kind==="booked";
  var box=el("div","prog");
  var track=el("div","track");
  /* seats claimed sit behind seats actually confirmed, so you can see the gap */
  var soft=el("div","fill soft"); soft.style.width=Math.min(100,(taken/cap0)*100)+"%";
  track.appendChild(soft);
  var firm=el("div","fill"+(booked&&conf<FLOOR?" gold":""));

  track.appendChild(firm);

    var notch=el("div","notch"); notch.style.left=((FLOOR/cap0)*100)+"%";
    notch.title="needs "+FLOOR+" confirmed"; track.appendChild(notch);
  }
  box.appendChild(track);
  var capr=el("div","cap"), left=el("span");
  if(booked){

      ? "<b>Going ahead</b> — "+conf+" confirmed"
      : "<b>"+taken+" seated</b> · needs "+FLOOR+" confirmed";
  } else {

  var tc=tableCount(Math.max(conf,taken));
  capr.appendChild(el("span",null,(tc>1?tc+" tables · ":"")+(booked?"booked":"drop-in")));
  box.appendChild(capr);

}

function weekRank(a){
  var ph=phaseOf(a), s=mySeat(a.id);
  if(isCancelled(a))return 6;
  if(!s&&myLostSeat(a.id))return 6;
  if(!s&&myWaitPos(a.id))return 4;
  if(ph==="confirming"&&s&&!s.confirmed)return 0;
  if(ph==="done"&&s&&s.confirmed&&!myCheckin(a))return 1;
  if(ph==="done"&&s&&s.confirmed&&myCheckin(a)&&myCheckin(a).madeIt&&!mySignal(a))return 1;
  if(ph==="running")return 2;
  if(ph==="locked")return 3;
  if(ph==="open"||ph==="confirming")return 4;
  return 5;
}
function peopleMet(){
  if(!state.me)return [];

    var ci=myCheckin(a); if(!(ci&&ci.madeIt))return;
    var sigs=state.signals[a.id]||{}, mine=sigs[state.me.id];
    myTable(a.id).forEach(function(p){
      if(p.studentId===state.me.id)return;
      var th=sigs[p.studentId];
      var mutual=!!(mine&&th&&(mine.friends||[]).indexOf(p.studentId)>=0
        &&(th.friends||[]).indexOf(state.me.id)>=0);
      var cur=out[p.studentId];
      if(!cur){ out[p.studentId]={id:p.studentId,name:p.name,act:a,at:ts(a),mutual:mutual,times:1}; }
      else{
        cur.times++;
        if(mutual)cur.mutual=true;
        if(ts(a)>cur.at){cur.at=ts(a);cur.act=a;}
      }
    });
  });
  return Object.keys(out).map(function(k){return out[k];})
    .sort(function(x,y){return y.at-x.at;});
}

function nextActivity(){

async function fillTable(){
  var a=nextActivity(); if(!a){toast("No activities to fill.",true);return;}
  var names=["Priya","Marcus","Dani","Yusuf","Lena","Theo","Ama","Jonas","Nadia","Kwame"];
  var free=capOf(a)-takenSeats(a.id).length;
  if(free<=0){toast(a.title+" is already full.");return;}
  for(var i=0;i<free;i++){
    var sid=uid("demo"), nm=names[Math.floor(Math.random()*names.length)];
    for(var n=1;n<=capOf(a);n++){
      var ref=seatDoc(a.id,n);
      try{
        var l=await ref.acquire({holder:sid,ttlMs:3000});
        if(!l.acquired)continue;
        var sn=await ref.get();
        if(sn.exists&&sn.data().studentId)continue;
        await ref.set({seatNo:n,studentId:sid,name:nm,claimedAt:Date.now(),confirmed:false,paid:PRICE,demo:true});
        await studentDoc(sid).set({id:sid,name:nm,intent:Math.random()<0.5?"open":"friends",
          group:["w","m","n"][Math.floor(Math.random()*3)],adult:true,demo:true,joinedAt:Date.now()});
        break;

async function confirmOthers(){

  var list=takenSeats(a.id).filter(function(s){return !s.confirmed&&(!state.me||s.studentId!==state.me.id);});
  if(!list.length){toast("Nobody left to confirm.");return;}
  for(var i=0;i<list.length;i++){
    try{await seatDoc(a.id,list[i].seatNo).update({confirmed:true,confirmedAt:Date.now()});}
    catch(e){toast(dbFail(e),true);return;}

async function signalOthers(a){
  var others=confirmedSeats(a.id).filter(function(s){return !state.me||s.studentId!==state.me.id;});
  for(var i=0;i<others.length;i++){
    var picks=confirmedSeats(a.id).filter(function(s){return s.studentId!==others[i].studentId;})
      .map(function(s){return s.studentId;});
    try{
      await signalDoc(a.id,others[i].studentId).set({studentId:others[i].studentId,
        friends:picks, romantic:Math.random()<0.6?picks:[], at:Date.now(),kind:"signal"});
    }catch(e){}

async function runTour(){
  if(!state.me){toast("Claim a seat first — then this walks the rest.",true);switchTab("slate");return;}
  var a=nextActivity(); if(!a)return;
  toast("Filling the table…"); await fillTable();
  await setClock(confirmOpensAt(a)+30*60e3-Date.now());
  toast("Confirm window is open — confirming everyone…"); await sleep(600);
  await confirmOthers();
  await sleep(400);
  toast("Jumping past the event…");

/* ============================================================ signing in
   Campus-only is a real product rule, so the address check is real. The code
   step is not - no mail is sent and any six digits pass - and the screen says
   so rather than pretending. The address never leaves this device: it is not
   written to the shared database, because anyone with the link can read that. */
function isUniEmail(e){
  if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(e))return false;
  var d=e.split("@")[1].toLowerCase();
  if(/^(gmail|hotmail|outlook|yahoo|icloud|proton|protonmail|live|aol|mail)\./.test(d))return false;
  return /\.edu$/.test(d)||/\.edu\.[a-z]{2,}$/.test(d)||/\.ac\.[a-z]{2,}$/.test(d);
}

  var a=$("auth"); a.innerHTML="";

  if(authState.step>0){
    var back=el("button","aback","‹ Back"); back.type="button";
    back.addEventListener("click",function(){ authState.step--; drawAuth(); });
    top.appendChild(back);
  }
  a.appendChild(top);
  var body=el("div","abody"); a.appendChild(body);

  if(authState.step===0){
    authHead(body,"Meet people who are into what you're into.",
      "Campus only. Six seats, $5 a seat, and something already happening.");
    var f=el("div","field");
    f.appendChild(el("label",null,"University email"));
    var i=el("input"); i.id="auth-email"; i.type="email"; i.inputMode="email";
    i.autocomplete="email"; i.placeholder="you@student.mmu.edu.my"; i.value=authState.email;
    f.appendChild(i);
    f.appendChild(el("div","hint","We check the domain, not you. A personal address won't get in — that's the whole point of a campus app."));
    body.appendChild(f);
    var err=el("div","note bad"); err.hidden=true; body.appendChild(err);
    var go=el("button","btn","Continue"); go.type="button";
    var submit=function(){
      var v=i.value.trim();
      if(!v){ err.textContent="Pop your university address in."; err.hidden=false; i.focus(); return; }
      if(!isUniEmail(v)){
        err.textContent = /^(gmail|hotmail|outlook|yahoo|icloud)\./.test((v.split("@")[1]||"").toLowerCase())
          ? "Lobby is campus-only, so that needs to be your university address."
          : "That doesn't look like a university address — try the one ending .edu, .edu.my or .ac.uk.";
        err.hidden=false; i.focus(); return;
      }
      authState.email=v; authState.step=1; drawAuth();
    };
    go.addEventListener("click",submit);
    i.addEventListener("keydown",function(e){ if(e.key==="Enter")submit(); });
    body.appendChild(go);
    var skip=el("button","linkish","Have a look around first"); skip.type="button";
    skip.addEventListener("click",closeSignIn); body.appendChild(skip);
  }
  else if(authState.step===1){
    authHead(body,"Check your email.","We sent a six-digit code to "+authState.email+".");
    var pf=el("div","field");
    pf.appendChild(el("label",null,"Code"));
    var ci=el("input"); ci.id="auth-code"; ci.type="text"; ci.inputMode="numeric";
    ci.maxLength=6; ci.placeholder="000000"; ci.className="codein";
    pf.appendChild(ci); body.appendChild(pf);
    var sim=el("div","note warn");
    sim.innerHTML="<b>Prototype.</b> No email was actually sent and any six digits will do. A real build would send a one-time code and nothing else.";
    body.appendChild(sim);
    var cerr=el("div","note bad"); cerr.hidden=true; body.appendChild(cerr);
    var go2=el("button","btn","Verify"); go2.type="button";
    var submit2=function(){
      if(!/^\d{6}$/.test(ci.value.trim())){
        cerr.textContent="Six digits — any six, it's a prototype."; cerr.hidden=false; ci.focus(); return;
      }
      authState.step=2; drawAuth();
    };
    go2.addEventListener("click",submit2);
    ci.addEventListener("keydown",function(e){ if(e.key==="Enter")submit2(); });
    body.appendChild(go2);
    setTimeout(function(){ ci.focus(); },60);
  }
  else {
    authHead(body,"Nearly there.","Only your first name ever reaches a table.");
    var nf=el("div","field"); nf.appendChild(el("label",null,"First name"));
    var ni=el("input"); ni.id="auth-name"; ni.type="text"; ni.autocomplete="given-name";
    ni.placeholder="What the table calls you"; nf.appendChild(ni); body.appendChild(nf);

    var df=el("div","field"); df.appendChild(el("label",null,"Date of birth"));
    var di=el("input"); di.id="auth-dob"; di.type="date"; df.appendChild(di);
    df.appendChild(el("div","hint","18+ only, and that's firm — a romantic-signal feature plus minors isn't a line we get to blur."));
    body.appendChild(df);

    var inf=el("div","field"); inf.appendChild(el("label",null,"What are you here for?"));
    var chosen={v:"friends"}; var pick=el("div","pick");
    [["friends","Just here for friends"],["open","Open to meeting someone"],["unsure","Not sure yet"]]
      .forEach(function(o,idx){
        var pb=el("button","pickbtn",o[1]); pb.type="button";
        pb.setAttribute("aria-pressed",String(idx===0));
        pb.addEventListener("click",function(){
          chosen.v=o[0];
          Array.prototype.forEach.call(pick.children,function(k){k.setAttribute("aria-pressed","false");});
          pb.setAttribute("aria-pressed","true");
        });
        pick.appendChild(pb);
      });
    inf.appendChild(pick);
    inf.appendChild(el("div","hint","Asked once, shown to nobody, never used to decide who you sit with. Say friends and you will never be asked to rate anyone romantically."));
    body.appendChild(inf);

    var aerr=el("div","note bad"); aerr.hidden=true; body.appendChild(aerr);
    var done=el("button","btn","Create my account"); done.type="button";
    done.addEventListener("click",async function(){
      var nm=ni.value.trim(), dob=di.value;
      var bad=function(m){ aerr.textContent=m; aerr.hidden=false; };
      if(nm.length<2){ bad("Give the table something to call you."); ni.focus(); return; }
      if(!dob){ bad("We need a date of birth for the 18+ check."); di.focus(); return; }
      var age=ageFrom(dob);
      if(age===null){ bad("That date didn't parse."); return; }
      if(age<18){ bad("Lobby is 18+ only. That's a hard line, not a setting — sorry."); return; }
      if(age>120){ bad("That date is in the wrong century."); return; }
      done.disabled=true; done.textContent="Setting you up…";
      await createMe(nm,dob,chosen.v);
      state.me.email=authState.email;          // stays on this device, never in the shared db
      lsSet(LS_ME,state.me);
      var after=authState.after;
      closeSignIn();
      if(after) after();
    });
    body.appendChild(done);
  }
  a.focus();
}
function signOut(){
  askSheet({title:"Sign out?",body:"Your seats and signals stay in the shared data — this device just forgets who you were, which is how you demo it as somebody else.",
    confirmLabel:"Sign out",danger:true,onConfirm:function(){
      localStorage.removeItem(LS_ME); state.me=null; state.seenSeats={};
      switchTab("slate"); toast("Signed out.");
    }});
}

/* ============================================================ onboarding */
var ONB=[
  {t:"Something's already happening",
   p:"Trivia on Thursday. Bouldering on Saturday. You don't have to organise anything or think of anything to say — the thing you're doing does that.",
   i:"slate"},
  {t:"Six seats, five dollars",
   p:"The money isn't a subscription, it covers the activity. It exists because free plans get flaked on, and a table of two strangers is the one outcome this is built to avoid.",
   i:"seat"},
  {t:"Confirm, then just turn up",
   p:"A day before, one tap to confirm. Then the chat opens with the plan already in it and somebody named to say hello first.",
   i:"clock"}
];
function showOnboarding(){
  var idx=0, o=$("onb");
  function draw(){
    o.innerHTML="";
    var body=el("div","body");
    var ic=icon(ONB[idx].i,52); ic.style.color="var(--green)"; ic.setAttribute("stroke-width","1.6");
    var art=el("div","art"); art.appendChild(ic); body.appendChild(art);
    var h=el("h2",null,ONB[idx].t); h.id="onb-title"; body.appendChild(h);

      o.appendChild(skip);

    o.focus();
  }
  o.hidden=false; draw();
}

/* ============================================================ presenting
   A social app demoed by one person on one screen looks like an empty room.
   This drives the app through the whole loop with a line to say at each step,
   so a single presenter can show what six people would normally show. */
function showAct(){
  var big=state.activities.filter(function(a){return capOf(a)>6&&phaseOf(a)!=="done";});
  if(big.length)return big.sort(function(x,y){return ts(x)-ts(y);})[0];
  return nextActivity();
}
async function ensureShowMe(){
  if(state.me)return;
  await createMe("You","2005-01-01","open");
}
async function showClaim(a){
  if(mySeat(a.id))return;
  await ensureShowMe();
  await takeSeat(a);
}
async function showJump(a,fn){ await setClock(fn(a)-Date.now()); }

var SHOW=[
 {say:"This is the week. Four real things, real places, real times — you don't browse people, you pick something to do.",
  run:async function(){ closeSheet(); await setClock(0); switchTab("slate"); }},
 {say:"Six seats each. Nobody here knows each other yet, and that's the point — the activity carries the conversation.",
  run:async function(){ switchTab("slate"); openActivitySheet(showAct()); }},
 {say:"Five dollars. Not a subscription — it covers the activity, and it's the reason people actually turn up.",
  run:async function(){ closeSheet(); await showClaim(showAct()); switchTab("week"); }},
 {say:"A day before, one tap to confirm. Miss the window and the seat goes back to the waitlist, and the five dollars doesn't.",
  run:async function(){ var a=showAct(); await showJump(a,function(x){return confirmOpensAt(x)+30*60e3;});
    switchTab("week"); }},
 {say:"That's it confirmed. Now fill the rest of the room — on a real campus these are other students claiming seats all week.",
  run:async function(){ var a=showAct(); var s=mySeat(a.id);
    if(s&&!s.confirmed){ try{ await seatDoc(a.id,s.seatNo).update({confirmed:true,confirmedAt:Date.now()}); }catch(e){} }
    await fillTable(); await confirmOthers(); switchTab("slate"); }},
 {say:function(){ var a=showAct(), n=confirmedSeats(a.id).length, t=seatingFor(a.id);
    return n+" people chose "+a.title.toLowerCase()+", so it becomes "+
      (t.length>1?t.length+" tables of about "+Math.round(n/t.length):"one table")+
      ". This is the only matching in the product — and it happens after everyone already agreed on the activity."; },
  run:async function(){ var a=showAct(); await showJump(a,function(x){return confirmClosesAt(x)+5*60e3;});
    switchTab("week"); await sleep(500); openTableSheet(a); await sleep(900); refreshChatLog(a.id); }},
 {say:"The bot posts first with the plan and a named host, so nobody has to be the one who speaks first. That's the single biggest reason group chats die.",
  run:async function(){ var a=showAct(); await maybePostBot(a); await sleep(500); refreshChatLog(a.id); }},
 {say:"Afterwards, two questions — and only one of them is about dating, only for people who said at signup that they wanted it.",
  run:async function(){ var a=showAct(); closeSheet();
    await showJump(a,function(x){return endsAt(x)+30*60e3;});
    await signalOthers(a); switchTab("week"); await sleep(300);
    await saveCheckin(a,true,""); await sleep(300); openSignalSheet(a); }},
 {say:"Silent unless it's mutual. Nobody is ever told they weren't picked — including you, just now.",
  run:async function(){ }},
 {say:"And week two has a reason to exist: the people you actually met, and the table chat that never closed.",
  run:async function(){ closeSheet(); switchTab("week"); }}
];

function renderShowBar(){
  var old=$("showbar"); if(old)old.remove();
  if(!state.show.on)return;
  var bar=el("div","showbar"); bar.id="showbar";
  var n=el("div","n",(state.show.i+1)+"/"+SHOW.length);
  bar.appendChild(n);
  var line=SHOW[state.show.i].say;
  bar.appendChild(el("p","say",typeof line==="function"?line():line));
  var nav=el("div","nav");
  var back=el("button","sb","‹"); back.type="button"; back.setAttribute("aria-label","Previous step");
  back.disabled=state.show.i===0||state.show.busy;
  back.addEventListener("click",function(){ gotoStep(state.show.i-1); });
  var next=el("button","sb primary",state.show.i===SHOW.length-1?"Done":"Next ›"); next.type="button";
  next.disabled=state.show.busy;
  next.addEventListener("click",function(){
    if(state.show.i===SHOW.length-1) stopShow(); else gotoStep(state.show.i+1);
  });
  nav.appendChild(back); nav.appendChild(next); bar.appendChild(nav);
  var x=el("button","sx","Exit"); x.type="button";
  x.addEventListener("click",stopShow); bar.appendChild(x);
  document.body.appendChild(bar);
}
async function gotoStep(i){
  if(state.show.busy)return;
  state.show.i=Math.max(0,Math.min(SHOW.length-1,i));
  state.show.busy=true; renderShowBar();
  try{ await SHOW[state.show.i].run(); }catch(e){ toast("That step didn't run cleanly — carry on.",true); }
  state.show.busy=false; renderShowBar(); render();
}
async function startShow(){
  state.show.on=true; state.show.i=-1;
  document.body.classList.add("presenting");
  await gotoStep(0);
}
function stopShow(){
  state.show.on=false;
  document.body.classList.remove("presenting");
  renderShowBar(); render();
}
/* wipe only what the presenter did, so it can be run again */
async function resetShow(){
  if(!state.me){toast("Nothing to reset.");return;}
  var mine=state.me.id;
  for(var i=0;i<state.activities.length;i++){
    var a=state.activities[i];
    var s=seatsOf(a.id).filter(function(x){return x.studentId===mine;});
    for(var j=0;j<s.length;j++){ try{ await seatDoc(a.id,s[j].seatNo)["delete"](); }catch(e){} }
    try{ await signalDoc(a.id,mine)["delete"](); }catch(e){}
    try{ await signalDoc(a.id,mine+"__checkin")["delete"](); }catch(e){}
    try{ await waitDoc(a.id,mine)["delete"](); }catch(e){}
  }
  await setClock(0);
  markSeatingDirty();
  toast("Reset. Ready to run it again.");
  switchTab("slate");
}

/* ============================================================ tabs */
function switchTab(name){
  state.tab=name;
  ["slate","week","you"].forEach(function(t){
    $("screen-"+t).hidden=(t!==name);
    $("tab-"+t).setAttribute("aria-selected",String(t===name));
  });
  render();
  try{window.scrollTo({top:0,behavior:"instant"});}catch(e){window.scrollTo(0,0);}
}
Array.prototype.forEach.call(document.querySelectorAll(".tabbar button"),function(b){
  b.addEventListener("click",function(){switchTab(b.dataset.tab);});
});
Array.prototype.forEach.call(document.querySelectorAll("#filters button"),function(b){
  b.addEventListener("click",function(){
    var k=b.dataset.f; state.filters[k]=!state.filters[k];
    b.setAttribute("aria-pressed",String(!!state.filters[k]));
    lsSet(LS_FILTERS,state.filters); renderSlate();
  });
});

/* ============================================================ boot */
var subscribed={};
function subscribeAll(){
  actColl().onSnapshot(function(snap){
    state.activities=snap.docs.map(function(d){var b=d.data()||{};b.id=d.id;return b;})
      .filter(function(a){return a.startsAt&&a.title;});
    markSeatingDirty();
    state.mode=isLocalStore?"local":"live";
    state.activities.forEach(function(a){
      if(subscribed[a.id])return;
      subscribed[a.id]=true;
      seatColl(a.id).onSnapshot(function(s){
        state.seats[a.id]=s.docs.map(function(d){return d.data();}).filter(function(x){return x&&x.seatNo;});
        markSeatingDirty();
        render(); maybePostBot(a); reapUnconfirmed(a); maybePromote(a);
      },function(e){toast(dbFail(e),true);});
      chatColl(a.id).onSnapshot(function(cs){
        var m={}; cs.docs.forEach(function(d){ m[d.id]=(d.data()||{}).messages||[]; });
        state.chats[a.id]=m; refreshChatLog(a.id); render();
      });
      waitColl(a.id).onSnapshot(function(ws){
        state.waits[a.id]=ws.docs.map(function(d){return d.data();}).filter(function(x){return x&&x.studentId;});
        render(); maybePromote(a);
      });
      signalColl(a.id).onSnapshot(function(s){
        var m={}; s.docs.forEach(function(d){m[d.id]=d.data();});
        state.signals[a.id]=m; render();
      });
    });
    render();
  },function(e){toast(dbFail(e),true);state.mode=isLocalStore?"local":"live";render();});

  poolColl().onSnapshot(function(ps){
    state.pool=ps.docs.map(function(d){return d.data();}).filter(function(x){return x&&x.studentId;});
    render(); tryFormMatch();
  });
  matchColl().onSnapshot(function(ms){
    state.matches=ms.docs.map(function(d){var b=d.data()||{};b.id=d.id;return b;});
    render();
  });
  store.collection("blocks").onSnapshot(function(bs){
    var m={}; bs.docs.forEach(function(d){ m[d.id]=d.data(); });
    state.blocks=m; markSeatingDirty(); render();
  });
  store.collection("students").onSnapshot(function(ss){
    var m={}; ss.docs.forEach(function(d){ m[d.id]=d.data(); });
    state.students=m; markSeatingDirty(); render();
  });
  clockDoc().onSnapshot(function(d){
    state.clockOffset=d.exists&&typeof d.data().offsetMs==="number"?d.data().offsetMs:0;
    render();
  });
}
async function boot(){
  state.me=lsGet(LS_ME,null);
  state.filters=lsGet(LS_FILTERS,{});
  state.sound=lsGet(LS_SOUND,true);
  Array.prototype.forEach.call(document.querySelectorAll("#filters button"),function(b){
    b.setAttribute("aria-pressed",String(!!state.filters[b.dataset.f]));
  });
  render();
  if(!lsGet(LS_ONB,false)) showOnboarding();

  var db=null;
  try{ if(window.claude&&typeof window.claude.use==="function") db=await window.claude.use("db"); }
  catch(e){ db=null; }
  if(db){ store=db; isLocalStore=false; state.mode="live"; }
  else { store=makeLocalStore(); isLocalStore=true; state.mode="local"; }
  subscribeAll();
  setInterval(function(){ if(state.tab!=="you"&&$("veil").hidden) render(); },30000);
}
boot();
})();
</script>
